name: desktop
on:
  workflow_dispatch:
  pull_request:   # preview builds, published as a pr-<number> pre-release linked from the PR
    types: [opened, synchronize, reopened, closed]
  push:
    tags: ['v*']
permissions:
  contents: write   # publish the release
jobs:
  mac:
    if: github.event.action != 'closed'
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # a PR build is its own app ("Music pr-12", own app id and data folder) so it installs next to the real one
      - if: github.event_name == 'pull_request'
        run: jq --arg n "pr-${{ github.event.number }}" '.name += "-" + $n | .productName += " " + $n | .build.appId += "." + $n' package.json > p.json && mv p.json package.json
        working-directory: desktop
      - run: pnpm navidrome && pnpm build:frontend
        working-directory: desktop
      # unsigned build: assemble the app, ad-hoc sign it (required on Apple Silicon), then package dmg + zip
      - run: |
          pnpm pack:mac:dir
          codesign --force --deep --sign - release/mac-arm64/*.app
          pnpm pack:mac
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      # portable preview: the app, a launcher and an empty Data folder in one zip; started through the launcher,
      # the app keeps its library index, settings and passwords in that Data folder instead of ~/Library
      - if: github.event_name == 'pull_request'
        run: |
          app=$(ls -d release/mac-arm64/*.app)
          exe=$(ls "$app/Contents/MacOS")
          name="Music-pr-${{ github.event.number }}-portable-mac-arm64"
          mkdir -p "portable/$name/Data"
          cp -R "$app" "portable/$name/"
          printf '#!/bin/zsh\nhere="$(cd -- "$(dirname -- "$0")" && pwd)"\nexec "$here/%s/Contents/MacOS/%s" --data-dir "$here/Data" "$@"\n' "$(basename "$app")" "$exe" > "portable/$name/Open Music.command"
          chmod +x "portable/$name/Open Music.command"
          ditto -c -k --sequesterRsrc --keepParent "portable/$name" "release/$name.zip"
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Music-mac-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
  linux:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # a PR build is its own app ("Music pr-12", own app id and data folder) so it installs next to the real one
      - if: github.event_name == 'pull_request'
        run: jq --arg n "pr-${{ github.event.number }}" '.name += "-" + $n | .productName += " " + $n | .build.appId += "." + $n' package.json > p.json && mv p.json package.json
        working-directory: desktop
      - run: pnpm dist   # navidrome + frontend + AppImage and deb
        working-directory: desktop
      # portable preview, see the mac job; the launcher extracts the AppImage at runtime so FUSE is not needed
      - if: github.event_name == 'pull_request'
        run: |
          name="Music-pr-${{ github.event.number }}-portable-linux-x64"
          mkdir -p "portable/$name/Data"
          cp release/*.AppImage "portable/$name/Music.AppImage"
          printf '#!/bin/sh\nhere="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"\nexport APPIMAGE_EXTRACT_AND_RUN=1\nexec "$here/Music.AppImage" --data-dir "$here/Data" "$@"\n' > "portable/$name/Open Music.sh"
          chmod +x "portable/$name/Open Music.sh"
          tar -czf "release/$name.tar.gz" -C portable "$name"
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Music-linux-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
  # a tag push (v0.1.0 …) also publishes a GitHub release with every build attached and notes from the commits
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
  # a PR build replaces the PR's pr-<number> pre-release and keeps one comment on the PR pointing at it
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository   # fork PRs get a read-only token
    needs: [mac, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    concurrency: preview-${{ github.event.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - run: |
          gh release delete "pr-$PR" --cleanup-tag --yes || true
          gh release create "pr-$PR" release/* --prerelease --latest=false --target "$SHA" --title "Preview of PR #$PR" \
            --notes "Built from ${SHA::7}. Installs as **Music pr-$PR** next to the regular app, with its own library. Builds are unsigned: on a Mac, right-click the app and choose Open the first time. The portable zip and tar.gz keep all data in their Data folder: extract the whole folder and start Open Music.command or Open Music.sh."
          {
            echo "### Preview build for ${SHA::7}"
            echo "Installs as **Music pr-$PR** next to the regular app. All files: $(gh release view "pr-$PR" --json url -q .url)"
            echo
            gh release view "pr-$PR" --json assets -q '.assets[] | "- [\(.name)](\(.url))"'
          } > comment.md
          gh pr comment "$PR" --edit-last --body-file comment.md || gh pr comment "$PR" --body-file comment.md
  # closing the PR removes its preview
  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "pr-${{ github.event.number }}" --cleanup-tag --yes || true
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
